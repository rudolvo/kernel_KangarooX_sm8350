name: Kernel Build tes2
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libncurses5-dev libssl-dev lzop python3 unzip zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Remove old KernelSU (if any)
        run: |
          git rm -f --cached KernelSU || true
          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile drivers/Kconfig
          echo "Sisa hook lama (kalau ada):"
          grep -rn "ksu_handle" fs kernel || echo "tidak ada"

      - name: Add KernelSU Next (legacy)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "Branch KernelSU Next yang kepakai:"
          git -C KernelSU-Next rev-parse --abbrev-ref HEAD
          git -C KernelSU-Next log -1 --oneline

      - name: Download Clang (Proton)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          clang/bin/clang --version

      - name: Build kernel
        run: |
          set -eo pipefail
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARGS="ARCH=arm64 O=out LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
          ls arch/arm64/configs | grep vili || true
          make $ARGS vili_defconfig
          scripts/config --file out/.config -e KPROBES -e KPROBE_EVENTS -e KSU -e KSU_KPROBE_HOOKS
          make $ARGS olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KPROBES" out/.config
          make -j$(nproc) $ARGS 2>&1 | tee build.log

      - name: Package (AnyKernel3)
        run: |
          ls -la out/arch/arm64/boot/ || true
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3 && zip -r9 ../kernel.zip . -x ".git*"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-build
          path: |
            kernel.zip
            build.log
